name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  JAVA_VERSION: 17

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Maven/Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Download Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: false
          cmake: false
          ndk-api: 24

      - name: Copy dashboard assets
        run: |
          mkdir -p android/app/src/main/assets
          cp c2_dashboard.html android/app/src/main/assets/

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk ../SpyTV.apk

      - name: Build Python C2 EXE (standalone)
        run: |
          # PyInstaller is used to create a standalone Windows EXE
          pip install pyinstaller
          # On Linux, use --target-arch x86_64 and WINE if cross-compiling,
          # or build the Python server package for the current platform
          pyinstaller --onefile --name "SpyTV-C2-standalone" \
            --add-data "c2_dashboard.html:." \
            --add-data "c2_data:c2_data" \
            --hidden-import "reportlab" \
            --hidden-import "yaml" \
            c2_server.py

      - name: Calculate checksums
        run: |
          ANDROID_APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "files: [" > SHA256SUMS_manifest.json
          echo "  { name: 'SpyTV-Standalone.apk', path: '$ANDROID_APK' }" >> SHA256SUMS_manifest.json
          echo "]" >> SHA256SUMS_manifest.json
          cat > SHA256SUMS.txt << 'EOF'
          # SpyTV Release Checksums
          EOF
          sha256sum "$ANDROID_APK" | awk '{print $2, $1}' >> SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spytv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload standalone EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: spytv-exe
          path: dist/SpyTV-C2-standalone*
          if-no-files-found: error

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: spytv-checksums
          path: SHA256SUMS.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create SHA256SUMS file
        run: |
          cd artifacts
          echo "# SpyTV v${{ steps.version.outputs.VERSION }} Release" > SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          sha256sum spytv-apk/* 2>/dev/null | sed 's|spytv-apk/||' >> SHA256SUMS.txt || echo "No APK found" >> SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          echo "Release assets:" >> SHA256SUMS.txt
          echo "  SpyTV.apk      - Android APK with standalone C2 mode" >> SHA256SUMS.txt
          echo "  SpyTV-C2-standalone.exe  - Windows standalone executable" >> SHA256SUMS.txt
          echo "  SHA256SUMS.txt  - This checksum manifest" >> SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: SpyTV v${{ steps.version.outputs.VERSION }}
          body_path: .github/RELEASE_TEMPLATE.md
          files: |
            artifacts/spytv-apk/*
            artifacts/spytv-exe/*
            artifacts/spytv-checksums/*
          generate_release_notes: true